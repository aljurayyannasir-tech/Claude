# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# NOTE: yarn_mappings / loader_version / fabric_version below are
# PLACEHOLDERS. This build environment blocks all of fabricmc.net,
# meta.fabricmc.net, and modrinth.com, so the exact current values for
# 1.21.11 could not be looked up and verified. Before building, replace
# these with the real values from https://fabricmc.net/develop/ (pick
# Minecraft version 1.21.11) or from the Fabric API releases page.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.REPLACE_ME
loader_version=REPLACE_ME

# Mod Properties
mod_version=1.0.0
maven_group=com.pvptrainer
archives_base_name=sword-pvp-trainer

# Dependencies
fabric_version=REPLACE_ME
